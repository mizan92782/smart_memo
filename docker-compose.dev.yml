# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml — DEVELOPMENT STACK
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   Core:        db, redis, web, celery, celery-beat
#   Monitoring:  prometheus, grafana, loki, promtail
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml up --build -d   (detached)
#
# Dashboards:
#   API:        http://localhost:8001
#   Grafana:    http://localhost:3000   (admin / admin)
#   Prometheus: http://localhost:9090
#   Alertmgr:   http://localhost:9093
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ════════════════════════════════════════════════════════════

  db:
    image: postgres:15-alpine
    container_name: ikon_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ikon_db}
      POSTGRES_USER: ${POSTGRES_USER:-ikon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikon_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5431:5432"           # host:container — access via localhost:5431
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikon_user} -d ${POSTGRES_DB:-ikon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ikon_redis_dev
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6378:6379"           # host:container
    networks:
      - backend

  web:
    build:
      context: .
      target: development
    container_name: ikon_api_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                              # live code reload
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
      - logs_dev:/app/logs                  # shared with promtail
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      LOCAL_RUN: "False"
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      DJANGO_SETTINGS_MODULE: smart_memo.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
      - monitoring

