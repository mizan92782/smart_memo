# scripts/nginx/app.conf
# Nginx Site Configuration — IKON Backend
# Reverse proxy from Nginx → Gunicorn/Uvicorn (Django)
# ─────────────────────────────────────────────────────────
# Usage:
#   Copy to /etc/nginx/sites-available/ikon_backend
#   Enable: ln -s /etc/nginx/sites-available/ikon_backend /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────

upstream django_backend {
    server 127.0.0.1:8000;         # Gunicorn/Uvicorn listening on 8000
    keepalive 32;
}

# ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${SERVER_NAME};     # Set actual domain in setup script

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # Let's Encrypt challenge path
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${SERVER_NAME};

    # ── SSL Certificates (Let's Encrypt / Certbot) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_NAME}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Client Limits ─────────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/ikon_access.log;
    error_log  /var/log/nginx/ikon_error.log warn;

    # ── Static Files ──────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media Files ───────────────────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── API Proxy to Django ───────────────────────────────────────────────
    location / {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering    off;
    }

    # ── Health Check ──────────────────────────────────────────────────────
    location /health/ {
        proxy_pass http://django_backend;
        access_log off;
    }

    # ── Grafana Proxy (optional — if Grafana runs on :3000) ──────────────
    # location /grafana/ {
    #     proxy_pass http://localhost:3000/;
    #     proxy_set_header Host $host;
    # }
}
