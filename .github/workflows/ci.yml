name: Smart Memo SaaS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Security & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_memo_test
          POSTGRES_USER: smart_memo_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5431:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6378:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: smart_memo.settings
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: smart_memo_test
      DB_USER: smart_memo_user
      DB_PASSWORD: test_password_123
      DB_HOST: 127.0.0.1
      DB_PORT: 5431
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6378

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Security scan with Bandit
        run: |
          bandit -c .bandit.yaml -r . -x ./scripts/test.py

      - name: Verify zero pending migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run automated test suite
        run: |
          python manage.py test --noinput
