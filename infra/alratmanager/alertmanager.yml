# infra/alratmanager/alertmanager.yml
# Alertmanager Configuration
# Handles routing of Prometheus alerts → Email + Telegram
# ─────────────────────────────────────────────────────────
# Setup:
#   dev:  Alerts sent to dev email + dev Telegram chat
#   prod: Alerts sent to prod email + prod Telegram chat
# ─────────────────────────────────────────────────────────

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${ALERT_EMAIL_FROM}'         # Set in .env: ALERT_EMAIL_FROM
  smtp_auth_username: '${ALERT_EMAIL_USER}' # Set in .env: ALERT_EMAIL_USER
  smtp_auth_password: '${ALERT_EMAIL_PASS}' # Set in .env: ALERT_EMAIL_PASS
  smtp_require_tls: true
  resolve_timeout: 5m

# ── Templates ──────────────────────────────────────────────────────────────
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# ── Routing Tree ───────────────────────────────────────────────────────────
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'env', 'severity']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h

  routes:
    # Critical alerts → email + telegram
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true

    # Warning alerts → telegram only
    - match:
        severity: warning
      receiver: 'telegram-receiver'

    # Dev environment alerts → dev channels
    - match:
        env: dev
      receiver: 'dev-receiver'

# ── Receivers ──────────────────────────────────────────────────────────────
receivers:
  # Default: email + telegram for production
  - name: 'default-receiver'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        headers:
          subject: '{{ template "email.subject" . }}'
    webhook_configs:
      - url: 'http://telegram-bot:8080/alert'   # Telegram bot webhook
        send_resolved: true

  # Critical: email + telegram
  - name: 'critical-receiver'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        html: '{{ template "email.html" . }}'
        headers:
          subject: '🚨 [CRITICAL] {{ template "email.subject" . }}'
    webhook_configs:
      - url: 'http://telegram-bot:8080/alert'
        send_resolved: true

  # Telegram only (warnings)
  - name: 'telegram-receiver'
    webhook_configs:
      - url: 'http://telegram-bot:8080/alert'
        send_resolved: true

  # Dev: console (no external notifications)
  - name: 'dev-receiver'
    email_configs:
      - to: '${DEV_ALERT_EMAIL_TO}'
        send_resolved: true

# ── Inhibit Rules ───────────────────────────────────────────────────────────
inhibit_rules:
  # Suppress warning alerts when a critical alert is firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
