# infra/prometheus/prometheus.yml
# Prometheus Configuration — Metrics Scraping
# Scrapes metrics from Django (django-prometheus), Celery, Redis, Nginx, Node Exporter
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: django
    static_configs:
      - targets: [web:8000]
        labels: {app: ikon-backend, env: production}
    metrics_path: /metrics

  - job_name: celery
    static_configs:
      - targets: [celery_exporter:9808]

  - job_name: redis
    static_configs:
      - targets: [redis_exporter:9121]

  - job_name: postgres
    static_configs:
      - targets: [postgres_exporter:9187]

  - job_name: node
    static_configs:
      - targets: [node_exporter:9100]

  - job_name: nginx
    static_configs:
      - targets: [nginx_exporter:9113]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
