# infra/grafana/provisioning/datasources/loki.yml
# Grafana Datasource Provisioning — Loki (Log Aggregation)
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 1000
    version: 1
    editable: true
